spring.application.name=Proyecto_DW

#Para definir el puerto donde escucha el servidor web
server.port=85

#Para definir el formato de despliegue de fecha y hora del log
logging.pattern.dateformat=hh:mm

#Para evitar mensajes invasivos
spring.main.banner-mode=off

#En producción esto es true, en desarrollo es false
spring.thymeleaf.cache=false

#Conexion a la BD local TechShop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/reservas_canchas

#Usuario y clave de la base de datos -creaTablas.sql-
spring.datasource.username=usuario_canchas
spring.datasource.password=Clave_Canchas1.

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#para mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=Trace
# spring.security.user.password=admin
spring.jpa.hibernate.ddl-auto=update

