spring.application.name=Proyecto_DW

# Definir el puerto donde escucha el servidor web
server.port=85

# Formato de despliegue de fecha y hora del log
logging.pattern.dateformat=hh:mm

# Evitar mensajes invasivos
spring.main.banner-mode=off

# En producción esto es true, en desarrollo es false
spring.thymeleaf.cache=false

# Conexion a la BD MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/reservas_canchas
spring.datasource.username=PONER_USUARIO_BD
spring.datasource.password=PONER_PASSWORD_BD

# Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=Trace
spring.jpa.hibernate.ddl-auto=update

# Configuración de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=PONER_CORREO_GMAIL
spring.mail.password=PONER_APP_PASSWORD_GMAIL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de Google OAuth2
spring.security.oauth2.client.registration.google.client-id=PONER_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=PONER_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Servidor
servidor.http=localhost
