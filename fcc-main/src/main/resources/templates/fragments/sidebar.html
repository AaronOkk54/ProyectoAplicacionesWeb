<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>

<aside th:fragment="sidebar(activeItem)"
       class="w-64 h-full bg-white border-r border-gray-200 flex-col hidden lg:flex shadow-sm z-20 shrink-0">
    <!-- Logo & Brand -->
    <div class="p-5 flex items-center gap-3 border-b border-gray-100">
        <div class="w-10 h-10 rounded-lg bg-green-400 flex items-center justify-center text-gray-900 shadow-md">
            <span class="material-symbols-outlined">sports_soccer</span>
        </div>
        <div>
            <h1 class="text-sm font-bold text-gray-900 leading-tight">ReservaCanchaCR</h1>
            <span sec:authorize="hasRole('ADMIN')"
                  class="text-xs font-semibold text-red-700 tracking-wide bg-red-100 px-2 py-0.5 rounded-full">ADMIN</span>
            <span sec:authorize="hasRole('VENDEDOR') and !hasRole('ADMIN')"
                  class="text-xs font-semibold text-blue-700 tracking-wide bg-blue-100 px-2 py-0.5 rounded-full">VENDEDOR</span>
            <span sec:authorize="!hasRole('ADMIN') and !hasRole('VENDEDOR')"
                  class="text-xs font-semibold text-green-700 tracking-wide bg-green-100 px-2 py-0.5 rounded-full">CLIENTE</span>
        </div>
    </div>
    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1">
        <!-- General -->
        <a th:href="@{/usuario/inicio}"
           th:class="${activeItem == 'inicio'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
            <span class="material-symbols-outlined text-[20px]">home</span>
            Inicio
        </a>
        <a th:href="@{/canchas/listado}"
           th:class="${activeItem == 'canchas'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
            <span class="material-symbols-outlined text-[20px]">sports_soccer</span>
            Canchas
        </a>

        <!-- Reservas -->
        <div class="mt-3 pt-3 border-t border-gray-100">
            <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Reservas</p>
            <a th:href="@{/reserva/mis-reservas}"
               th:class="${activeItem == 'misReservas'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
                <span class="material-symbols-outlined text-[20px]">calendar_month</span>
                Mis Reservas
            </a>
        </div>

        <!-- Mis Canchas - VENDEDOR y ADMIN -->
        <div sec:authorize="hasAnyRole('VENDEDOR','ADMIN')" class="mt-3 pt-3 border-t border-gray-100">
            <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Mis Canchas</p>
            <a th:href="@{/canchas/mis-canchas}"
               th:class="${activeItem == 'misCanchas'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
                <span class="material-symbols-outlined text-[20px]">stadium</span>
                Mis Canchas
            </a>
            <a th:href="@{/canchas/crear}"
               th:class="${activeItem == 'crearCancha'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
                <span class="material-symbols-outlined text-[20px]">add_circle</span>
                Registrar Cancha
            </a>
        </div>

        <!-- Administración - solo ADMIN -->
        <div sec:authorize="hasRole('ADMIN')" class="mt-3 pt-3 border-t border-gray-100">
            <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Administración</p>
            <a th:href="@{/usuario/listado}"
               th:class="${activeItem == 'usuarios'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
                <span class="material-symbols-outlined text-[20px]">group</span>
                Gestión de Usuarios
            </a>
        </div>

        <!-- Cuenta -->
        <div class="mt-3 pt-3 border-t border-gray-100">
            <a th:href="@{/usuario/perfil}"
               th:class="${activeItem == 'perfil'} ? 'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold text-sm transition-colors' : 'flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors'">
                <span class="material-symbols-outlined text-[20px]">person</span>
                Mi Perfil
            </a>
            <a th:href="@{/ayuda}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium text-sm transition-colors">
                <span class="material-symbols-outlined text-[20px]">help_outline</span>
                Ayuda
            </a>
        </div>
    </nav>
    <!-- Logout -->
    <div class="p-4 border-t border-gray-100">
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="flex items-center gap-3 w-full px-3 py-2 text-gray-500 hover:text-red-600 transition-colors text-sm font-medium bg-transparent border-none cursor-pointer">
                <span class="material-symbols-outlined text-[20px]">logout</span>
                Cerrar sesión
            </button>
        </form>
    </div>
</aside>

</body>
</html>
