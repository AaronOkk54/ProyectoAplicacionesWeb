# Canchas
cancha.guardada=Cancha registrada exitosamente.
cancha.actualizada=Cancha actualizada exitosamente.
cancha.eliminada=Cancha eliminada exitosamente.
cancha.error.noexiste=La cancha solicitada no existe.
cancha.error.guardar=Ocurrió un error al guardar la cancha.
cancha.error.actualizar=Ocurrió un error al actualizar la cancha.
