reserva.completada=Reserva marcada como completada.
reserva.error.noexiste=La reserva solicitada no existe.
reserva.error.canchaOcupada=La cancha no está disponible en el horario seleccionado.
reserva.error.guardar=Ocurrió un error al guardar la reserva. Verifica los datos ingresados.
reserva.error.noConfirmable=Solo se pueden confirmar reservas en estado PENDIENTE.
reserva.error.noCancelable=No se puede cancelar esta reserva en su estado actual.
reserva.error.general=Ocurrió un error inesperado. Inténtalo nuevamente.

