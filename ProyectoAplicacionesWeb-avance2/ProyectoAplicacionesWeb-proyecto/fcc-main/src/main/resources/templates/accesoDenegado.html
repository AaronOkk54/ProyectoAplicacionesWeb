<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ReservaCanchaCR - Acceso Denegado</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df20d",
                        "primary-dark": "#0bc90b",
                        "secondary": "#102210",
                    },
                    fontFamily: { "display": ["Lexend", "sans-serif"] },
                },
            },
        }
    </script>
    <style>body { font-family: 'Lexend', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center font-display">
    <div class="text-center p-8">
        <div class="inline-flex items-center justify-center size-20 bg-red-100 rounded-full mb-6">
            <span class="material-symbols-outlined text-5xl text-red-500">lock</span>
        </div>
        <h1 class="text-6xl font-bold text-slate-800 mb-2">403</h1>
        <h2 class="text-2xl font-semibold text-slate-700 mb-4">Acceso Denegado</h2>
        <p class="text-slate-500 mb-8 max-w-md">No tienes permisos para acceder a esta página.</p>
        <div class="flex gap-4 justify-center">
            <a th:href="@{/}" class="px-6 py-3 bg-primary text-secondary font-bold rounded-lg hover:bg-primary-dark transition-colors">
                Volver al Inicio
            </a>
            <a th:href="@{/login}" class="px-6 py-3 border-2 border-slate-300 text-slate-700 font-bold rounded-lg hover:bg-slate-100 transition-colors">
                Iniciar Sesión
            </a>
        </div>
    </div>
</body>
</html>
